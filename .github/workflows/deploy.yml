name: Deploy MkDocs

# Ensure the GITHUB_TOKEN has write access to push site files
permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install mkdocs mkdocs-material mkdocs-rss-plugin

      - name: Configure git user
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Debug mkdocs config
        run: |
          pip show mkdocs mkdocs-rss-plugin || true
          mkdocs --version
          mkdocs build -v

      - name: Build & deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs gh-deploy --force
