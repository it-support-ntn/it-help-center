name: Deploy MkDocs

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install mkdocs mkdocs-material PyRSS2Gen

      - name: Build site
        run: mkdocs build

      - name: Generate RSS
        run: |
          python3 - << 'EOF'
          import os, datetime
          import PyRSS2Gen

          rss = PyRSS2Gen.RSS2(
              title = "IT Help Center",
              link = "https://<your-username>.github.io/it-help-center/",
              description = "Knowledgebase updates",
              lastBuildDate = datetime.datetime.now(),
              items = []
          )

          docs_path = "docs"
          for file in os.listdir(docs_path):
              if file.endswith(".md"):
                  with open(os.path.join(docs_path, file), 'r') as f:
                      lines = f.readlines()
                      title = lines[0].replace('#','').strip() if lines else file
                  rss.items.append(PyRSS2Gen.RSSItem(
                      title = title,
                      link = f"https://<your-username>.github.io/it-help-center/{file.replace('.md','.html')}",
                      description = f"{title} article",
                      guid = PyRSS2Gen.Guid(file),
                      pubDate = datetime.datetime.now()
                  ))

          with open("site/rss.xml", "w") as f:
              rss.write_xml(f)
          EOF

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs gh-deploy --force
